<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover lets the page paint under a notch; env(safe-area-inset-*)
       then keeps the DOM controls clear of it. User scaling stays ALLOWED on
       purpose — a player must be able to pinch-zoom into small text. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>POVODEŇ — Flood</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0a0f1a;
      color: #e6eef7;
      font-family: monospace;
      overflow: hidden;
    }
    body {
      /* No rubber-band / pull-to-refresh stealing a drag from the card hand. */
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* Pinned to the *dynamic* viewport: on Android Chrome 100vh is the LARGE
       viewport (address bar hidden), so with the bar showing the box would be
       taller than the visible area and the bottom of the FIT canvas (END
       PREPARATION, the card hand) would sit off-screen with no way to scroll.
       100dvh fixes that natively; src/ui/mobile.js also sets an explicit px
       height from visualViewport for browsers without dvh. */
    #game {
      position: fixed;
      top: 0;
      left: 0;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      /* No flex centring here: Phaser's CENTER_BOTH already centres the canvas
         with margins, and the two stacked made the letterbox lopsided. */
    }
    /* Crisp scaling for the pixel-art era look. */
    #game canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      /* Kills the 300ms tap delay / double-tap-to-zoom on the canvas while
         leaving pinch-zoom (two fingers) working. */
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <!-- Optional scoreboard API. Defaults to same-origin "/api" (works when the
       game is served by server/index.js). If the API lives elsewhere, set it
       here; if unreachable, the game simply plays without a scoreboard. -->
  <!-- <script>window.POVODEN_API = "https://your-server.example/api";</script> -->
  <!-- Phaser vendored locally so the build is fully static / offline-hostable. -->
  <script src="vendor/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
