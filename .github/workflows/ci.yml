name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Zero-dependency test suite: the game model runs headless on Node's
      # built-in test runner — no browser, no database, nothing to install.
      - run: npm test
